<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Egenmelding – flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1FB;--ink:#1B1F4B;--front:#fff;--back:#2B2F77;--backink:#fff;--acc:#FF8A1F;--muted:#6B7099;--chip:#fff;--line:#D9DEF3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142E;--ink:#EEF0FF;--front:#1E2250;--back:#FF8A1F;--backink:#1B1F4B;--muted:#9EA3D6;--chip:#1E2250;--line:#33387A}}
:root[data-theme="dark"]{--bg:#12142E;--ink:#EEF0FF;--front:#1E2250;--back:#FF8A1F;--backink:#1B1F4B;--muted:#9EA3D6;--chip:#1E2250;--line:#33387A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:24px 18px 32px}
h1{font-size:28px;font-weight:800;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:700 14px 'Nunito',sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#1B1F4B}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.count{font-size:14px;color:var(--muted);margin-bottom:14px;font-weight:700}
.scene{perspective:1200px;height:340px}
.card{position:relative;width:100%;height:100%;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.8,.3,1);font-family:inherit;text-align:left}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;padding:26px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 40px -18px rgba(27,31,75,.45)}
.f{background:var(--front);color:var(--ink);border:1.5px solid var(--line)}
.b{background:var(--back);color:var(--backink);transform:rotateY(180deg)}
.tag{align-self:flex-start;font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px;background:var(--acc);color:#1B1F4B}
.b .tag{background:rgba(255,255,255,.2);color:inherit}
.txt{font-size:28px;font-weight:800;line-height:1.25;text-wrap:balance}
.b .txt{font-size:23px;font-weight:700;line-height:1.45}
.hint{font-size:13px;color:var(--muted);font-weight:700}
.b .hint{color:inherit;opacity:.75}
.ctl{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:800 16px 'Nunito',sans-serif;padding:14px;border-radius:16px;cursor:pointer}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible,.card:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.card,.bar i{transition:none}}
@media (max-width:420px){.scene{height:380px}.txt{font-size:25px}}
</style>
</head>
<body>
<main>
<h1>Egenmelding</h1>
<p class="sub">Trykk på kortet for å se svaret.</p>
<div class="chips" id="chips"></div>
<div class="bar"><i id="bar"></i></div>
<div class="count" id="count"></div>
<div class="scene"><button class="card" id="card" aria-label="Vend kortet">
<div class="face f"><span class="tag" id="tagF"></span><div class="txt" id="front"></div><span class="hint">Trykk for å vende</span></div>
<div class="face b"><span class="tag" id="tagB"></span><div class="txt" id="back"></div><span class="hint">Trykk for å vende tilbake</span></div>
</button></div>
<div class="ctl">
<button class="btn" id="prev">Tilbake</button>
<button class="btn" id="shuf">Bland</button>
<button class="btn p" id="next">Neste</button>
</div>
</main>
<script>
var ALL=[
["Ord","en egenmelding","Du sier selv at du er syk. Du trenger ikke lege."],
["Ord","et egenmeldingsskjema","Et skjema. Du leverer det når du er tilbake på jobb."],
["Ord","en regel","Noe du må gjøre. Sjekk reglene på jobben din."],
["Ord","omsorg","Du tar vare på barnet ditt."],
["Ord","egenmelding ved barns sykdom","Barnet ditt er sykt. Du er hjemme fra jobb."],
["Egen sykdom","Du er syk og kan ikke jobbe. Hva må du gjøre?","Du må si ifra til sjefen med en gang."],
["Egen sykdom","Hvordan sier du ifra?","Du ringer sjefen din. Noen steder er det andre regler."],
["Egen sykdom","Hva skriver du i en enkel egenmelding?","«Jeg var borte fra jobb tirsdag og onsdag på grunn av sykdom.» Så skriver du navnet ditt."],
["Regler","Hvor mange dager kan en egenmelding gjelde?","En, to eller tre kalenderdager."],
["Regler","Hvor mange egenmeldinger kan du bruke?","Noen jobber: fire ganger på 12 måneder."],
["Regler","Hvor lenge må du ha jobbet på arbeidsplassen?","I to måneder."],
["Regler","Hvor lenge må du vente før en ny egenmelding?","16 dager etter en egenmelding eller sykmelding."],
["Regler","Hvem må vite hvor mange egenmeldinger du har brukt?","Du selv."],
["Sykt barn","Hvor lenge har du rett til egenmelding for barnet?","Til slutten av året barnet fyller 12 år."],
["Sykt barn","Du har ett eller to barn. Hvor mange dager kan du være hjemme?","Opptil 10 dager hvert år."],
["Sykt barn","Du har ett eller to barn og er alene om omsorgen. Hvor mange dager?","Opptil 20 dager."],
["Sykt barn","Du har tre eller flere barn. Hvor mange dager kan du være hjemme?","Opptil 15 dager hvert år."],
["Sykt barn","Du har tre eller flere barn og er alene om omsorgen. Hvor mange dager?","Opptil 30 dager."]
];
var cats=["Alle","Ord","Egen sykdom","Regler","Sykt barn"];
var cur="Alle",deck=ALL.slice(),i=0;
var $=function(id){return document.getElementById(id)};
var card=$("card");
function render(){
  var c=deck[i];
  card.classList.remove("flip");
  $("front").textContent=c[1];$("back").textContent=c[2];
  $("tagF").textContent=c[0];$("tagB").textContent=c[0];
  $("count").textContent="Kort "+(i+1)+" av "+deck.length;
  $("bar").style.width=((i+1)/deck.length*100)+"%";
}
function setCat(c){cur=c;deck=ALL.filter(function(x){return c==="Alle"||x[0]===c});i=0;
  document.querySelectorAll(".chip").forEach(function(b){b.setAttribute("aria-pressed",b.textContent===c)});render()}
cats.forEach(function(c){var b=document.createElement("button");b.className="chip";b.textContent=c;b.setAttribute("aria-pressed",c==="Alle");b.onclick=function(){setCat(c)};$("chips").appendChild(b)});
function go(d){i=(i+d+deck.length)%deck.length;render()}
card.onclick=function(){card.classList.toggle("flip")};
$("next").onclick=function(){go(1)};$("prev").onclick=function(){go(-1)};
$("shuf").onclick=function(){for(var k=deck.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=deck[k];deck[k]=deck[j];deck[j]=t}i=0;render()};
document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
render();
</script>
</body>
</html>
